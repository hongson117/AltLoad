name: Fork CI (Apple TV branch)

# Unofficial personal fork. Builds the Rust core + the app UNSIGNED to check that it
# compiles. The IPA artifact is private to this repo's Actions, kept 1 day, and is not
# a release (the AltLoad License forbids publishing builds; see LICENSE.md §3).
on:
  push:
    branches: [appletv-install]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Export DEVELOPER_DIR
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install tools
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew install xcodegen

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Rust tests (host)
        working-directory: core
        run: cargo test --lib

      - name: Build Rust FFI xcframework
        run: bash ./scripts/build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AltLoad.xcodeproj \
            -scheme AltLoad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/AltLoad.app"
          test -d "$APP"
          rm -rf Payload AltLoad.ipa && mkdir -p Payload
          cp -R "$APP" Payload/
          for EXT in Payload/AltLoad.app/PlugIns/*.appex; do
            [[ -d "$EXT" ]] && codesign --force --sign - --timestamp=none --generate-entitlement-der "$EXT"
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der Payload/AltLoad.app
          zip -qry -X AltLoad.ipa Payload
          ls -lh AltLoad.ipa

      - name: Upload IPA (private, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: AltLoad-unsigned-ipa
          path: AltLoad.ipa
          retention-days: 1
          if-no-files-found: error
